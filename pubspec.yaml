name: portfolio
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cloud_firestore: ^6.3.0
  firebase_core: ^4.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.2
  phosphor_flutter: ^2.1.0
  shared_preferences: ^2.5.5
  universal_html: ^2.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/profile_images/
    - assets/flags/
    - assets/cvs/
    - assets/
    - assets/experiences_images/
    - assets/projects_images/
  
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/Space_Grotesk/SpaceGrotesk-VariableFont_wght.ttf
    
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/Share_Tech_Mono/ShareTechMono-Regular.ttf

    - family: FiraCode
      fonts:
        - asset: assets/fonts/Fira_Code/FiraCode-VariableFont_wght.ttf
